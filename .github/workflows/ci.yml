name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run check

  python-model-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-model-service/pyproject.toml
      - run: python -m pip install -e .
        working-directory: python-model-service
      - run: python -m unittest discover -s tests -p "test_*.py"
        working-directory: python-model-service
