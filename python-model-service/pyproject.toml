[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ipcamp-model-service"
version = "0.4.3"
description = "超级 IP 创造营的独立 Python 模型服务"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "langgraph>=1.0,<2",
  "langsmith>=0.4.25,<1",
  "pydantic==2.11.7",
  "uvicorn[standard]==0.35.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
